name: Build and release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: ./build-app.sh

      - env:
          ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          asset="Mumutte-${RELEASE_TAG}-macos-${ARCH}.zip"
          ditto -c -k --sequesterRsrc --keepParent .build/Mumutte.app "$asset"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mumutte-${{ github.ref_name }}-macos-${{ matrix.arch }}
          path: Mumutte-${{ github.ref_name }}-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Mumutte-${{ github.ref_name }}-macos-*
          path: release-assets
          merge-multiple: true

      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/*.zip --generate-notes --title "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          fi
